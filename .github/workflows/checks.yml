# Runs the self-checks (tests/Faro.Checks) on every PR and push, on the three desktop platforms Faro targets,
# compiles the Java runtime, and builds the C# sample's Android APK the way File › Build Android APK does.
name: Checks

on:
  pull_request:
  push:
    branches: [canary, main]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Faro.Checks

  # The Java runtime binder (src/Faro.Runtime.Java) compiled with the Java sample, as Java projects build it.
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B -q -f samples/HelloFaroJava/pom.xml compile

  # Android APK of the C# sample through Faro's own build (Faro.Editor --build-apk); the APK is kept as an artifact.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - run: dotnet run --project src/Faro.Editor -- --build-apk samples/HelloFaro
      - uses: actions/upload-artifact@v4
        with:
          name: HelloFaro-apk
          path: samples/HelloFaro/dist/*.apk
      # Starts the APK on an Android emulator: it must still be running after 30 s. The screenshot shows what it drew.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash .github/android-smoke.sh samples/HelloFaro/dist/HelloFaro.apk io.faro.hellofaro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HelloFaro-on-emulator
          path: |
            android-screen.png
            android-logcat.txt

  # Android APK of the Java sample: GluonFX with Gluon's GraalVM, again through Faro.Editor --build-apk.
  # ponytail: not started on an emulator — GluonFX builds arm64 only and CI's fast emulators are x86_64.
  android-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Gluon GraalVM
        run: |
          curl -sSL -o graalvm.tar.gz "https://github.com/gluonhq/graal/releases/download/gluon-23%2B25.1-dev-2409082136/graalvm-java23-linux-amd64-gluon-23+25.1-dev.tar.gz"
          mkdir -p "$RUNNER_TEMP/graalvm" && tar -xzf graalvm.tar.gz -C "$RUNNER_TEMP/graalvm" --strip-components=1
          echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" # Maven and the APK's Gradle run on JDK 21; only native-image uses GraalVM
      - run: dotnet run --project src/Faro.Editor -- --build-apk samples/HelloFaroJava
      - name: GluonFX logs
        if: failure()
        run: find samples/HelloFaroJava/.faro/android/target/gluonfx -name '*.log' -exec tail -n 60 {} +
      - uses: actions/upload-artifact@v4
        with:
          name: HelloFaroJava-apk
          path: samples/HelloFaroJava/dist/*.apk
