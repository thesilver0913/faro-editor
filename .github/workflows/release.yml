# Builds the Windows installer and the Linux archive. A tag "v0.2.4" (Stable), "v0.2.4-beta.1" (Beta) or
# "v0.2.4-canary.1" (Canary) publishes them as a GitHub Release, which Faro's update check reads.
# PRs that touch the installer or this workflow build them as a dry run (artifacts only, no release).
# Run it by hand (Actions › Release › Run workflow) with a tag to release the chosen branch's head under that tag,
# or, for a tag that already exists (e.g. made on GitHub's release page), to build that tag and attach the files.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['installer/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0-beta.1 (empty: build only)'
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Existing tag
        if: github.event.inputs.tag != ''
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        # A manual run for a tag that already exists re-publishes that tag's build (e.g. files missing from its release).
        run: if git rev-parse -q --verify "refs/tags/$INPUT_TAG" > /dev/null; then git checkout -q "$INPUT_TAG"; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then v="${INPUT_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: dotnet publish src/Faro.Editor -c Release -r ${{ matrix.rid }} --self-contained false -p:Version=${{ env.VERSION }} -o publish/${{ matrix.rid }}
      - name: Installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$env:VERSION /DSourceDir=..\publish\win-x64 installer\faro.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Archive
        if: matrix.rid == 'linux-x64'
        run: mkdir -p dist && tar -czf dist/Faro-$VERSION-linux-x64.tar.gz -C publish/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A release already made on GitHub's release page (which creates the tag) just gets the files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit
          fi
          flags=(--generate-notes --target "$GITHUB_SHA") # a new tag (manual run) is created on the built commit
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
