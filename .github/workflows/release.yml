# Builds the Windows installer, the Linux archive and .deb, and the macOS installer packages (arm64, x64; ad-hoc signed). A tag "v0.2.4" (Stable) or
# "v0.2.4-beta.1" (Beta) publishes them as a GitHub Release, which Faro's update check reads.
# Every push to canary (each merged PR) builds Faro Canary, a separate app (its own name, icon, settings and installers),
# and publishes it as the pre-release "canary-<run number>"; only the newest few are kept.
# Each published run also refreshes, on the latest release, versions.txt (the non-canary versions, newest first) and
# Faro-Setup.exe, the web installer that releases/latest/download/Faro-Setup.exe always serves.
# PRs that touch the installer or this workflow build them as a dry run (artifacts only, no release).
# Run it by hand (Actions › Release › Run workflow) with a tag to release the chosen branch's head under that tag,
# or, for a tag that already exists (e.g. made on GitHub's release page), to build that tag and attach the files.
name: Release

on:
  push:
    tags: ['v*']
    branches: [canary]
  pull_request:
    paths: ['installer/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0-beta.1 (empty: build only)'
        required: false

concurrency: # a newer canary push supersedes a canary build still running; releases and PRs aren't cancelled
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/canary' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Existing tag
        if: github.event.inputs.tag != ''
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        # A manual run for a tag that already exists re-publishes that tag's build (e.g. files missing from its release).
        run: if git rev-parse -q --verify "refs/tags/$INPUT_TAG" > /dev/null; then git checkout -q "$INPUT_TAG"; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then v="${INPUT_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"; fi # BSD grep (macOS) has no -P
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # Faro Canary: same version (and Faro.Runtime) as the commit's, told apart by edition and build number
          if [[ "$GITHUB_REF" == refs/heads/canary ]]; then
            { echo "EDITION=Canary"; echo "BUILD=$GITHUB_RUN_NUMBER"; echo "LABEL=$v-build$GITHUB_RUN_NUMBER"; echo "APP=Faro Canary"; echo "CMD=faro-canary"; } >> "$GITHUB_ENV"
          else
            { echo "LABEL=$v"; echo "APP=Faro"; echo "CMD=faro"; } >> "$GITHUB_ENV"
          fi
      - run: dotnet publish src/Faro.Editor -c Release -r ${{ matrix.rid }} --self-contained false -p:Version=${{ env.VERSION }} -p:FaroEdition=${{ env.EDITION }} -p:FaroBuild=${{ env.BUILD }} -o publish/${{ matrix.rid }}
      - name: Installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $canary = if ($env:EDITION) { @('/DCanary', "/DBuild=$env:BUILD") } else { @() }
          & $iscc /DAppVersion=$env:VERSION /DSourceDir=..\publish\win-x64 @canary installer\faro.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $iscc "/DRepo=$env:GITHUB_REPOSITORY" installer\web.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Faro Canary's Setup is only made on canary pushes: other runs compile it too (thrown away), so a mistake shows before the merge
          if (-not $env:EDITION) { & $iscc /DAppVersion=$env:VERSION /DSourceDir=..\publish\win-x64 /DCanary /DBuild=0 "/O$env:RUNNER_TEMP\canary-check" installer\faro.iss; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Archive
        if: matrix.rid == 'linux-x64'
        run: |
          file=$([[ -n "$EDITION" ]] && echo FaroCanary || echo Faro)
          mkdir -p dist && tar -czf "dist/$file-$LABEL-linux-x64.tar.gz" -C publish/linux-x64 . -C "$PWD/installer" get-dotnet.sh
          bash installer/deb.sh "$LABEL" publish/linux-x64 dist "$EDITION"
      - name: Installer package
        if: startsWith(matrix.rid, 'osx-')
        run: bash installer/pkg.sh "$LABEL" ${{ matrix.rid }} publish/${{ matrix.rid }} dist "$EDITION"
      # Smoke tests: install the package the way a user does, then start Faro (--version prints the version and exits),
      # which proves the launcher finds .NET. The .deb and .pkg also run their .NET download when the runner's isn't seen.
      - name: Install and start (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-win-x64-setup.exe)[0].FullName
          # WaitForExit, not -Wait: -Wait also waits for the Faro window the installer starts afterwards.
          (Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\Faro" -PassThru).WaitForExit()
          Stop-Process -Name Faro.Editor -ErrorAction SilentlyContinue
          $faro = Start-Process "$env:RUNNER_TEMP\Faro\Faro.Editor.exe" -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\version.txt"
          Get-Content "$env:RUNNER_TEMP\version.txt"
          if ($faro.ExitCode -ne 0) { exit 1 }
      # The web installer: here with a fixed version (the version list lives on the latest release, made after a merge),
      # so this tests the download and the hand-over to the full Setup; Faro must start from the folder it installed into.
      - name: Web installer (Windows)
        if: matrix.rid == 'win-x64' && env.EDITION == ''
        shell: pwsh
        run: |
          (Start-Process dist\Faro-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/FAROVERSION=1.0.0', "/DIR=$env:RUNNER_TEMP\FaroWeb" -PassThru).WaitForExit()
          Stop-Process -Name Faro.Editor -ErrorAction SilentlyContinue
          $faro = Start-Process "$env:RUNNER_TEMP\FaroWeb\Faro.Editor.exe" -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\web-version.txt"
          Get-Content "$env:RUNNER_TEMP\web-version.txt"
          if ($faro.ExitCode -ne 0) { exit 1 }
      - name: Install and start (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get install -y ./dist/*.deb
          "$CMD" --version
      - name: Install and start (macOS)
        if: matrix.rid == 'osx-arm64' # the runner is Apple Silicon
        run: |
          sudo installer -pkg dist/*.pkg -target /
          "/Applications/$APP.app/Contents/MacOS/Faro.Editor" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' || github.ref == 'refs/heads/canary'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # only for the written release notes (docs/release-notes/<tag>.md)
        with:
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The web installer and the version list it reads go on the latest release (releases/latest/download/…),
          # refreshed by every published run; a canary run also brings them there the first time after a merge.
          refresh() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName -q '.[].tagName' | grep '^v' | sed 's/^v//' > versions.txt
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            gh release upload "$latest" dist/Faro-Setup.exe versions.txt --repo "$GITHUB_REPOSITORY" --clobber
          }
          if [[ "$GITHUB_REF" == refs/heads/canary ]]; then
            # Faro Canary: a pre-release per push, only its own files; the newest five are kept.
            version=$(ls dist/FaroCanary-*-win-x64-setup.exe | sed 's:.*/FaroCanary-\(.*\)-build.*:\1:')
            gh release create "canary-$GITHUB_RUN_NUMBER" dist/FaroCanary-* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Faro Canary $version (build $GITHUB_RUN_NUMBER)" --notes "Faro Canary, built from ${GITHUB_SHA::7} on canary. It installs next to Faro, with its own settings."
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^canary-' | sort -t- -k2 -rn | tail -n +6 |
              xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            refresh
            exit
          fi
          rm -f dist/FaroCanary-* # (none outside canary runs)
          # A release already made on GitHub's release page (which creates the tag) just gets the files.
          notes="docs/release-notes/$TAG.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            refresh
            # Written notes go above what the release already says, once (a re-run doesn't add them again).
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
            if [[ -f "$notes" ]] && ! grep -qF -- "$(head -n 1 "$notes")" <<< "$body"; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$(cat "$notes")"$'\n\n'"$body"
            fi
            exit
          fi
          flags=(--generate-notes --target "$GITHUB_SHA") # a new tag (manual run) is created on the built commit
          [[ -f "$notes" ]] && flags+=(--notes-file "$notes") # written notes first, then the generated PR list
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          refresh
